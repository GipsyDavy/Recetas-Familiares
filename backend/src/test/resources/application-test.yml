spring:
  datasource:
    # Tests corren contra PostgreSQL real (no hay Docker/Testcontainers en este
    # entorno). En local/CI apuntar estos env a una DB de test dedicada
    # (p.ej. recetas_familiares_test en Hetzner via WireGuard). Nunca la DB de
    # produccion: Flyway + ddl-auto=validate tocan el esquema.
    url: ${DB_TEST_URL:jdbc:postgresql://localhost:5432/recetas_familiares_test}
    username: ${DB_TEST_USERNAME:recetas_app}
    password: ${DB_TEST_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  security:
    jwt:
      secret: test-only-change-this-secret-32-bytes-minimum
      access-token-ttl-minutes: 15
      refresh-token-ttl-days: 30
    rate-limit:
      auth:
        enabled: false
  # Sin recetas de inicio en tests: los asserts parten de familias vacias
  starter-recipes:
    enabled: false
