spring:
  datasource:
    url: jdbc:h2:mem:recetas_familiares;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate

app:
  security:
    jwt:
      secret: test-only-change-this-secret-32-bytes-minimum
      access-token-ttl-minutes: 15
      refresh-token-ttl-days: 30
