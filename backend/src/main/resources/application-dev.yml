spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/recetas_familiares?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:recetas_app}
    password: ${DB_PASSWORD:}

app:
  dev:
    seed-data:
      enabled: ${DEV_SEED_DATA_ENABLED:false}
      email: ${DEV_SEED_EMAIL:demo@recetas.local}
      password: ${DEV_SEED_PASSWORD:}
      display-name: ${DEV_SEED_DISPLAY_NAME:Demo Recetas}
      family-name: ${DEV_SEED_FAMILY_NAME:Familia Demo}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000}
  security:
    jwt:
      # Sin fallback: el arranque falla si JWT_SECRET no esta definido (SEC-1).
      secret: ${JWT_SECRET}
