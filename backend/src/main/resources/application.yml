spring:
  application:
    name: recetas-familiares-backend
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # Chat permite hasta 5 imagenes x 8 MB por mensaje. El limite de request
      # debe cubrir ese lote mas el overhead multipart; si no, Tomcat rechaza
      # antes de la validacion de la app.
      max-file-size: 10MB
      max-request-size: 50MB

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  upload:
    dir: ${UPLOAD_DIR:./uploads}
    base-url: ${UPLOAD_BASE_URL:http://localhost:8080}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
      refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:30}
      revoked-refresh-token-retention-days: ${JWT_REVOKED_REFRESH_TOKEN_RETENTION_DAYS:7}
      refresh-token-cleanup-cron: ${JWT_REFRESH_TOKEN_CLEANUP_CRON:0 0 3 * * *}
    rate-limit:
      auth:
        enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
        max-requests: ${AUTH_RATE_LIMIT_MAX_REQUESTS:20}
        window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
