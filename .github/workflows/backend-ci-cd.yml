name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - backend/**
      - infra/backend/**
      - scripts/backend/**
      - .github/workflows/backend-ci-cd.yml
  # Sin filtro paths a proposito: este check es obligatorio para fusionar en
  # main. Con filtro, una PR que no tocara backend/ dejaba el check "expected"
  # para siempre y la PR no se podia fusionar nunca.
  #
  # OJO: el filtro del push de arriba NO se toca. Es lo que impide que un
  # commit ajeno al backend dispare el job deploy contra produccion.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  build:
    name: Build and test backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: recetas_familiares_test
          POSTGRES_USER: recetas_app
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recetas_app -d recetas_familiares_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_TEST_URL: jdbc:postgresql://localhost:5432/recetas_familiares_test
      DB_TEST_USERNAME: recetas_app
      DB_TEST_PASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test
        run: mvn -B -f backend/pom.xml test

      - name: Package
        run: mvn -B -f backend/pom.xml -DskipTests package

      - name: Stage artifact
        run: |
          mkdir -p backend-artifact
          cp backend/target/recetas-familiares-backend-0.1.0-SNAPSHOT.jar backend-artifact/recetas-familiares-backend-${GITHUB_SHA}.jar

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recetas-familiares-backend-${{ github.sha }}
          path: backend-artifact/*.jar
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy backend
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout deploy scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: recetas-familiares-backend-${{ github.sha }}
          path: backend-artifact

      - name: Configure SSH key
        env:
          BACKEND_DEPLOY_KEY: ${{ secrets.BACKEND_DEPLOY_KEY }}
        run: |
          test -n "$BACKEND_DEPLOY_KEY"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$BACKEND_DEPLOY_KEY" > ~/.ssh/recetas-backend-deploy
          chmod 0600 ~/.ssh/recetas-backend-deploy

      - name: Deploy release
        env:
          BACKEND_DEPLOY_HOST: ${{ secrets.BACKEND_DEPLOY_HOST }}
          BACKEND_DEPLOY_USER: ${{ secrets.BACKEND_DEPLOY_USER }}
          BACKEND_DEPLOY_PORT: ${{ secrets.BACKEND_DEPLOY_PORT }}
          BACKEND_DEPLOY_KEY_FILE: /home/runner/.ssh/recetas-backend-deploy
          BACKEND_DEPLOY_KNOWN_HOSTS: ${{ secrets.BACKEND_DEPLOY_KNOWN_HOSTS }}
          BACKEND_HEALTH_URL: https://recetas.167.233.213.242.sslip.io/api/v1/health
        run: |
          jar_path="$(find backend-artifact -maxdepth 1 -type f -name '*.jar' | head -n 1)"
          test -n "$jar_path"
          bash scripts/backend/deploy-backend-ci.sh "$jar_path"
