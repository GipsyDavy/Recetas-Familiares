name: Dependency Audit

# Auditoria semanal de dependencias con OWASP Dependency-Check (perfil
# security-audit de backend y desktop). No bloquea deploys: es un job
# independiente del pipeline CI/CD. Requiere el secret NVD_API_KEY.
# OSS Index corre anonimo en CI (las credenciales Sonatype solo existen
# en el settings.xml local); la cobertura NVD/CISA no depende de ello.
#
# La base de datos del NVD (~370k CVEs) se cachea entre runs con clave
# rotatoria por run_id + restore-keys por prefijo. Sin esa cache el job
# redescargaba el NVD entero cada semana: el analisis real tarda 11 segundos,
# la descarga tardaba horas y agoto el limite de 6h de GitHub (runs 29238931456
# y 30255543538, cancelados). `dataDirectory` es la propiedad real del plugin
# (no `data.directory`); si se cambia, verificarla contra su plugin.xml.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Cache base de datos NVD
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/dependency-check-data
          key: dependency-check-data-backend-${{ github.run_id }}
          restore-keys: |
            dependency-check-data-backend-

      - name: Dependency-Check backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >-
          mvn -B -f backend/pom.xml -P security-audit -DskipTests
          -DdataDirectory="$HOME/.m2/dependency-check-data" verify

      - name: Upload backend report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-check-backend
          path: backend/target/dependency-check-report.*
          if-no-files-found: warn
          retention-days: 30

  desktop:
    name: Desktop dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Cache base de datos NVD
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/dependency-check-data
          key: dependency-check-data-desktop-${{ github.run_id }}
          restore-keys: |
            dependency-check-data-desktop-

      - name: Dependency-Check desktop
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >-
          mvn -B -f desktop/pom.xml -P security-audit -DskipTests
          -DdataDirectory="$HOME/.m2/dependency-check-data" verify

      - name: Upload desktop report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-check-desktop
          path: desktop/target/dependency-check-report.*
          if-no-files-found: warn
          retention-days: 30
