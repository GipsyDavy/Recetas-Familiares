# Managed for Recetas Familiares PostgreSQL operation.
# Enables local WAL archiving for point-in-time recovery with base backups.
archive_mode = on
# El comando vive en un script versionado (infra/postgres/recetas-postgres-archive-wal).
# Dos motivos, ambos verificados el 2026-08-01:
#  1. §25.3.1 exige devolver 0 ante un destino preexistente con contenido IDENTICO y persistido,
#     y != 0 solo si difiere. El comando anterior ('test ! -f ... && cp ... && sync ...') fallaba
#     SIEMPRE con el destino presente y podia atascar el archiver tras una caida.
#  2. Ubuntu 26.04 usa uutils, no GNU coreutils. Su `sync FICHERO` NO hace fsync(2): llama a
#     sync() global y su codigo de salida no es fiable. El script usa os.fsync de Python sobre
#     el fichero Y sobre el directorio.
archive_command = '/usr/local/sbin/recetas-postgres-archive-wal %p %f'
archive_timeout = '15min'
